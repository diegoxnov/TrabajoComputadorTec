<h2 class="mb-4">{{ productoId ? 'Editar producto' : 'Nuevo producto' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()" class="col-12 col-md-8 col-lg-6">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" class="form-control" formControlName="nombre" />
  </div>

  <div class="mb-3">
    <label class="form-label">Categoría</label>
    <select class="form-select" formControlName="categoria">
      @for (categoria of categorias(); track categoria; let i = $index) {
        <option [value]="i">{{ categoria }}</option>
      }
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Marca</label>
    <input type="text" class="form-control" formControlName="marca" />
  </div>

  <div class="mb-3">
    <label class="form-label">Precio</label>
    <input type="number" step="0.01" class="form-control" formControlName="precio" />
  </div>

  <div class="mb-3">
    <label class="form-label">Stock</label>
    <input type="number" class="form-control" formControlName="stock" />
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Guardar</button>
</form>
